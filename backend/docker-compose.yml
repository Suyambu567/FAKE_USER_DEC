# Explicit project name. Without this, Compose derives the project from the
# directory name -- which is "backend", a name almost every project uses. On a
# shared host that silently merges this stack into someone else's "backend"
# project, and `docker compose down --remove-orphans` from here would then
# delete THEIR containers. Never remove this line.
name: fake-profile-detector

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fake-profile-detector:2.0.0
    container_name: fpd-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0            # inside the container network, not on the host NIC
      PORT: 8000
      WORKERS: ${WORKERS:-2}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_JSON: "true"
    ports:
      # host:container. The host port is configurable because 8000 is the most
      # contended port on any shared machine -- override with API_PORT in .env.
      #
      # Bound to loopback on purpose. Put a TLS-terminating reverse proxy
      # (nginx/Caddy/Traefik) in front; do not publish on 0.0.0.0 on a host
      # with a public IP.
      - "127.0.0.1:${API_PORT:-8200}:8000"
    volumes:
      # Model artifacts are mounted read-only so a compromised container cannot
      # swap the pickle it later deserialises.
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # One worker holds the model plus pandas/numpy arenas. 1 GB is generous
          # for a 0.5 MB artifact and stops a runaway batch from taking the box.
          memory: 1G
          cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
